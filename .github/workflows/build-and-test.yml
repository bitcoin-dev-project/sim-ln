name: Build, lint and test

on: workflow_call

permissions:
  contents: read

jobs:
  check:
    name: Check Code with stable output
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt install -y protobuf-compiler
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install Clippy
        run: rustup component add clippy
      - name: Install Rustfmt
        run: rustup component add rustfmt
      - name: run check
        run: make check

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Install protoc
        run: sudo apt install -y protobuf-compiler
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sim-cli
        run: make install
      - name: Install dev sim-cli
        run: make dev-install
      - name: cargo test
        run: cargo test --all-features --all-targets --benches

  integration-real:
    name: Integration tests (real nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install protoc
        run: sudo apt install -y protobuf-compiler
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Read pinned ldk-server rev
        id: ldk-rev
        run: echo "rev=$(grep -o 'ldk-server?rev=[a-f0-9]*' Cargo.lock | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Build ldk-server image
        uses: docker/build-push-action@v6
        with:
          context: "https://github.com/lightningdevkit/ldk-server.git#${{ steps.ldk-rev.outputs.rev }}"
          tags: simln-ldk-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run real-node integration tests
        run: make integration-real
        env:
          SIMLN_LDK_SERVER_IMAGE: simln-ldk-server:ci
